<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="loading">
  <!-- Background overlay for readability -->
  <div id="bg-overlay"></div>

  <!-- Weather widgets – top left, dynamically populated -->
  <div id="weather-container"></div>

  <!-- Mini clocks – top right, dynamically populated -->
  <div id="mini-clocks-container"></div>

  <!-- Clock – center -->
  <div id="clock-container">
    <div id="clock"></div>
    <div id="date"></div>
  </div>

  <!-- Settings gear – bottom right -->
  <button id="settings-btn" aria-label="Settings">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>

  <!-- Settings panel -->
  <div id="settings-panel">
    <div id="settings-inner">
      <div class="settings-header">
        <h2>Settings</h2>
        <button id="settings-close" aria-label="Close settings">&times;</button>
      </div>

      <!-- Clock settings -->
      <fieldset>
        <legend>Clock</legend>
        <label>
          <span>Format</span>
          <select id="setting-clock-format">
            <option value="24h">24-hour</option>
            <option value="12h">12-hour</option>
          </select>
        </label>
        <label>
          <span>Show seconds</span>
          <input type="checkbox" id="setting-show-seconds" checked>
        </label>
        <label>
          <span>Font family</span>
          <select id="setting-clock-font">
            <option value="'Segoe UI', system-ui, sans-serif">System Default</option>
            <option value="monospace">Monospace</option>
            <option value="'Georgia', serif">Serif (Georgia)</option>
            <option value="'Arial', sans-serif">Sans-serif (Arial)</option>
            <option value="'Courier New', monospace">Courier New</option>
            <option value="'Times New Roman', serif">Times New Roman</option>
            <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
            <option value="'Verdana', sans-serif">Verdana</option>
            <option value="custom">Custom (Google Fonts)</option>
          </select>
        </label>
        <label id="custom-font-label" class="hidden">
          <span>Font name</span>
          <input type="text" id="setting-clock-custom-font" placeholder="e.g. Roboto Mono">
        </label>
        <label>
          <span>Font weight</span>
          <select id="setting-clock-weight">
            <option value="100">100 — Thin</option>
            <option value="200">200 — Extra Light</option>
            <option value="300">300 — Light</option>
            <option value="400">400 — Regular</option>
            <option value="500">500 — Medium</option>
            <option value="600">600 — Semi Bold</option>
            <option value="700">700 — Bold</option>
            <option value="800">800 — Extra Bold</option>
            <option value="900">900 — Black</option>
          </select>
        </label>
        <label>
          <span>Clock size</span>
          <input type="range" id="setting-clock-size" min="48" max="300" value="96">
          <input type="number" id="setting-clock-size-num" min="12" max="600" value="96">
          <span class="input-suffix">px</span>
        </label>
        <label>
          <span>Clock color</span>
          <input type="color" id="setting-clock-color" value="#ffffff">
        </label>
        <label>
          <span>Date format</span>
          <select id="setting-date-format">
            <option value="long">Long (February 27, 2026)</option>
            <option value="short">Short (02/27/2026)</option>
            <option value="iso">ISO (2026-02-27)</option>
          </select>
        </label>
      </fieldset>

      <!-- World clocks settings -->
      <fieldset>
        <legend>World Clocks</legend>
        <div id="clock-cities-list"></div>
        <div id="add-clock-city-area">
          <label>
            <span>Add city</span>
            <div class="city-search-wrap" id="clock-city-search-wrap">
              <input type="text" id="setting-clock-city-search" placeholder="Search for a city...">
              <div class="city-results hidden" id="clock-city-results"></div>
            </div>
          </label>
        </div>
      </fieldset>

      <!-- Weather / location settings -->
      <fieldset>
        <legend>Weather &amp; Location</legend>
        <div id="locations-list"></div>
        <div id="add-location-area">
          <label>
            <span>Add city</span>
            <div class="city-search-wrap" id="city-search-wrap">
              <input type="text" id="setting-city-search" placeholder="Search for a city...">
              <div class="city-results hidden" id="city-results"></div>
            </div>
          </label>
        </div>
        <label>
          <span>Temperature unit</span>
          <select id="setting-temp-unit">
            <option value="celsius">Celsius</option>
            <option value="fahrenheit">Fahrenheit</option>
          </select>
        </label>
      </fieldset>

      <!-- Background settings -->
      <fieldset>
        <legend>Background</legend>
        <label>
          <span>Mode</span>
          <select id="setting-bg-mode">
            <option value="auto">Automatic (random on refresh)</option>
            <option value="pick">Pick an image</option>
            <option value="custom-image">Custom image</option>
            <option value="custom-dir">Custom folder</option>
            <option value="solid">Solid color</option>
          </select>
        </label>
        <div id="bg-picker-area" class="hidden">
          <p class="hint">Images found in <code>backgrounds/</code> folder:</p>
          <div id="bg-thumbs"></div>
          <p id="bg-no-images" class="hint hidden">No images found. Drop images into the <code>backgrounds/</code> folder and reload the extension.</p>
        </div>
        <div id="bg-custom-image-area" class="hidden">
          <label>
            <span>Choose image</span>
            <input type="file" id="setting-bg-custom-image-file" accept="image/*">
          </label>
          <img id="bg-custom-image-preview" alt="Preview">
        </div>
        <div id="bg-custom-dir-area" class="hidden">
          <label>
            <span>Choose folder</span>
            <input type="file" id="setting-bg-custom-dir-files" webkitdirectory>
          </label>
          <p id="bg-custom-dir-info" class="hint hidden"></p>
        </div>
        <label id="bg-color-label" class="hidden">
          <span>Background color</span>
          <input type="color" id="setting-bg-color" value="#252629">
        </label>
      </fieldset>
    </div>
  </div>

  <!-- Critical path: settings → background → clock → reveal -->
  <script src="imagestore.js"></script>
  <script src="background.js"></script>
  <script src="clock.js"></script>
  <script src="settings.js"></script>
  <script src="app.js"></script>
  <!-- weather.js loaded dynamically by app.js after initial render -->
</body>
</html>
