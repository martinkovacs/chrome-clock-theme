<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Background overlay for readability -->
  <div id="bg-overlay"></div>

  <!-- Weather widget – top left -->
  <div id="weather-widget">
    <div id="weather-icon"></div>
    <div id="weather-info">
      <div id="weather-temp">--°C</div>
      <div id="weather-desc">Loading...</div>
      <div id="weather-location-label"></div>
    </div>
  </div>

  <!-- Clock – center -->
  <div id="clock-container">
    <div id="clock">00:00:00</div>
    <div id="date"></div>
  </div>

  <!-- Settings gear – bottom right -->
  <button id="settings-btn" aria-label="Settings">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
      <path d="M19.14 12.94a7.07 7.07 0 0 0 .06-.94c0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.04 7.04 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.37 1.03.7 1.62.94l.36 2.54c.05.24.26.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.57 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/>
    </svg>
  </button>

  <!-- Settings panel -->
  <div id="settings-panel" class="hidden">
    <div id="settings-inner">
      <div class="settings-header">
        <h2>Settings</h2>
        <button id="settings-close" aria-label="Close settings">&times;</button>
      </div>

      <!-- Clock settings -->
      <fieldset>
        <legend>Clock</legend>
        <label>
          <span>Format</span>
          <select id="setting-clock-format">
            <option value="24h">24-hour</option>
            <option value="12h">12-hour</option>
          </select>
        </label>
        <label>
          <span>Show seconds</span>
          <input type="checkbox" id="setting-show-seconds" checked>
        </label>
        <label>
          <span>Font family</span>
          <select id="setting-clock-font">
            <option value="'Segoe UI', system-ui, sans-serif">System Default</option>
            <option value="monospace">Monospace</option>
            <option value="'Georgia', serif">Serif</option>
            <option value="'Arial', sans-serif">Sans-serif</option>
          </select>
        </label>
        <label>
          <span>Clock size</span>
          <input type="range" id="setting-clock-size" min="48" max="180" value="96">
          <span id="clock-size-val">96px</span>
        </label>
        <label>
          <span>Clock color</span>
          <input type="color" id="setting-clock-color" value="#ffffff">
        </label>
        <label>
          <span>Date format</span>
          <select id="setting-date-format">
            <option value="long">Long (February 27, 2026)</option>
            <option value="short">Short (02/27/2026)</option>
            <option value="iso">ISO (2026-02-27)</option>
          </select>
        </label>
      </fieldset>

      <!-- Weather / location settings -->
      <fieldset>
        <legend>Weather &amp; Location</legend>
        <label>
          <span>City name</span>
          <input type="text" id="setting-city" placeholder="e.g. Budapest">
        </label>
        <label>
          <span>Latitude</span>
          <input type="number" id="setting-lat" step="0.0001" placeholder="47.4979">
        </label>
        <label>
          <span>Longitude</span>
          <input type="number" id="setting-lon" step="0.0001" placeholder="19.0402">
        </label>
        <label>
          <span>Temperature unit</span>
          <select id="setting-temp-unit">
            <option value="celsius">Celsius</option>
            <option value="fahrenheit">Fahrenheit</option>
          </select>
        </label>
        <button id="btn-geolocate" type="button">Use my current location</button>
      </fieldset>

      <!-- Background settings -->
      <fieldset>
        <legend>Background</legend>
        <label>
          <span>Mode</span>
          <select id="setting-bg-mode">
            <option value="auto">Automatic (random on refresh)</option>
            <option value="pick">Pick an image</option>
            <option value="solid">Solid color</option>
          </select>
        </label>
        <div id="bg-picker-area" class="hidden">
          <p class="hint">Images found in <code>backgrounds/</code> folder:</p>
          <div id="bg-thumbs"></div>
          <p id="bg-no-images" class="hint hidden">No images found. Drop images into the <code>backgrounds/</code> folder and reload the extension.</p>
        </div>
        <label id="bg-color-label" class="hidden">
          <span>Background color</span>
          <input type="color" id="setting-bg-color" value="#1a1a2e">
        </label>
      </fieldset>

      <button id="btn-save-settings" type="button">Save</button>
    </div>
  </div>

  <script src="background.js"></script>
  <script src="weather.js"></script>
  <script src="clock.js"></script>
  <script src="settings.js"></script>
  <script src="app.js"></script>
</body>
</html>
