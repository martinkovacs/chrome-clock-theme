<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-header">
    <img src="icons/icon128.png" alt="" class="popup-icon">
    <span class="popup-title">Clock & Weather</span>
  </div>
  <div class="popup-row">
    <span class="popup-label">Enable on new tab</span>
    <label class="toggle">
      <input type="checkbox" id="toggle-enabled">
      <span class="toggle-slider"></span>
    </label>
  </div>
  <div class="popup-redirect" id="redirect-section" hidden>
    <label class="popup-label" for="redirect-url">Redirect to when disabled</label>
    <input type="text" id="redirect-url" class="popup-input"
           placeholder="chrome://new-tab-page/">
  </div>
  <script src="popup.js"></script>
</body>
</html>
